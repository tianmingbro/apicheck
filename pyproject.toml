[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keypilot"
version = "0.1.0"
description = "Shared API key pool with load balancing, quota management, and CLI/SDK"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "KEYPILOT Team"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "gunicorn>=21.0",
    "httpx>=0.24.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "databases[postgresql]>=0.7.0",
    "asyncpg>=0.28.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "redis>=5.0.0",
    "alembic>=1.12.0",
    "pydantic-settings>=2.0.0",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=3.2.0,<4.0.0",
    "cryptography>=41.0",
    "apscheduler>=3.10",
    "nest_asyncio>=1.5.0",
    "tqdm>=4.65.0",
    "openai>=1.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
keypilot = "legacy.cli:main"
keypilot-server = "app.main:start"

[project.urls]
Homepage = "https://github.com/yourusername/keypilot"

[tool.setuptools]
packages = [
    "legacy",
    "app",
    "app.api",
    "app.api.routes",
    "app.core",
    "app.db",
    "app.middleware",
    "app.models",
    "app.routers",
    "app.schemas",
    "app.services",
    "app.tasks",
    "app.utils",
]

[tool.setuptools.package-data]
legacy = ["py.typed"]
app = ["py.typed"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"