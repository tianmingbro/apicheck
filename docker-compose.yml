version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: keypilot-postgres
    environment:
      POSTGRES_USER: keypilot
      POSTGRES_PASSWORD: keypilot123
      POSTGRES_DB: keypilot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: keypilot-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: