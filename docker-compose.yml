version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: keypilot
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: keypilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keypilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - perf_net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - perf_net

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://api_farm:secret@postgres:5432/api_farm
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: perf_test_secret_key
      ENCRYPTION_KEY: 3Xx9HcWx7pP2vBqZQ5kLrN8yJtMfGdSs  # fernet key
      DEBUG: "false"
      RATE_LIMIT_ENABLED: "true"
      KEY_FAILURE_THRESHOLD: 3
      KEY_RECOVERY_TIMEOUT_SECONDS: 60
    ports:
      - "8000:8000"
    networks:
      - perf_net

  locust:
    image: locustio/locust:latest
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    environment:
      LOCUST_HOST: http://app:8000
      LOCUST_USERS: 50
      LOCUST_SPAWN_RATE: 5
      LOCUST_RUN_TIME: 120s
    ports:
      - "8089:8089"
    depends_on:
      - app
    networks:
      - perf_net

volumes:
  postgres_data:

networks:
  perf_net:
    driver: bridge